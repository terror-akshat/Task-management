name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B -ntp test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker:
    name: Docker Image + Smoke Test
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: task_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: task_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_user -d task_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t task-manager:ci .

      - name: Boot container and probe /health
        run: |
          set -euo pipefail
          docker run -d --name task-manager --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/task_db \
            -e SPRING_DATASOURCE_USERNAME=task_user \
            -e SPRING_DATASOURCE_PASSWORD=password \
            task-manager:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8001/health; then
              echo
              echo "container is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "container never became healthy"
          docker logs task-manager
          exit 1
