# Test-profile overrides.
#
# This file is loaded AFTER application.properties, so it OVERRIDES those values
# instead of replacing them. (A src/test/resources/application.properties would
# shadow src/main/resources/application.properties entirely on the test classpath,
# because target/test-classes precedes target/classes.)
#
# Activated by @ActiveProfiles("test") on DemoApplicationTests.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Repeated from src/main/resources/application.properties on purpose: this keeps
# the JWT properties resolvable even if a test-scope application.properties ever
# reappears and shadows the main one again.
jwt.secret=your-super-secret-key-that-is-at-least-32-characters-long
jwt.expiration=3600000
